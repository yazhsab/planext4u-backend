name: Backend Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        type: choice
        required: true
        default: staging
        options: [staging, production]
      service:
        description: ECS service and container name
        type: choice
        required: true
        default: platform
        options: [platform]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: backend-delivery-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}-${{ github.event_name == 'workflow_dispatch' && inputs.service || 'platform' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and publish immutable image
    if: vars.DELIVERY_ENABLED == 'true' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ vars.ECR_REPOSITORY }}
      target_environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      service: ${{ github.event_name == 'workflow_dispatch' && inputs.service || 'platform' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ARTIFACT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: planext4u-artifact-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push by source commit
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign the image digest
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Generate SPDX SBOM from the published digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Keyless-sign the SBOM attestation
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE@$DIGEST"
      - name: Record GitHub build provenance when enabled for the private repository
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy digest with rollback
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.publish.outputs.target_environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: planext4u-deploy-${{ github.run_id }}
      - name: Deploy and smoke check
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ needs.publish.outputs.service }}
          CONTAINER_NAME: ${{ needs.publish.outputs.service }}
          IMAGE_URI: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          DEPLOYMENT_ENVIRONMENT: ${{ needs.publish.outputs.target_environment }}
          DEPLOYMENT_EVIDENCE: deployment-evidence.json
        run: ./scripts/deploy-ecs.sh
      - name: Upload deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ needs.publish.outputs.target_environment }}-${{ github.run_id }}
          path: deployment-evidence.json
          if-no-files-found: error
          retention-days: 365
