name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-web:
    name: Administrator web verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install locked dependencies
        working-directory: admin-web
        run: npm ci
      - name: Install Chromium test runtime
        working-directory: admin-web
        run: npx playwright install --with-deps chromium
      - name: Verify typed administrator client
        working-directory: admin-web
        run: npm run verify
      - name: Verify desktop and mobile administrator workflows
        working-directory: admin-web
        run: npm run test:e2e

  verify:
    name: Go verification and SCA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-alpine3.22
        env:
          POSTGRES_DB: planext4u_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planext4u_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.10.0-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.14
          cache: true
      - name: Verify source, contracts, migrations and race safety
        run: make verify
      - name: Verify identity rotation, consent, tenancy and coverage against PostgreSQL
        env:
          IDENTITY_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-identity-integration
      - name: Verify distributed gateway rate limits against Redis
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: make test-gateway-integration
      - name: Verify atomic CMS publication against PostgreSQL
        env:
          CONFIGURATION_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-configuration-integration
      - name: Verify tenant-isolated catalog persistence against PostgreSQL
        env:
          CATALOG_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-catalog-integration
      - name: Verify durable carts, revisions and idempotency against PostgreSQL
        env:
          COMMERCE_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-commerce-integration
      - name: Verify durable checkout orchestration and recovery links against PostgreSQL
        env:
          CHECKOUT_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-checkout-integration
      - name: Verify oversell-safe inventory reservations against PostgreSQL
        env:
          INVENTORY_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-inventory-integration
      - name: Verify durable order lifecycle and notification intents against PostgreSQL
        env:
          ORDER_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-order-integration
      - name: Verify durable provider payments and exactly-once webhooks against PostgreSQL
        env:
          PAYMENT_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-payment-integration
      - name: Verify oversell-safe durable service bookings and restart recovery
        env:
          BOOKING_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-booking-integration
      - name: Verify durable vendor onboarding, field operations and catalog controls
        env:
          SUPPLY_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-supply-integration
      - name: Verify durable food pricing, payment, restaurant and dispatch lifecycle
        env:
          FOOD_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-food-integration
      - name: Verify durable driver assignment, tracking, chat, settlement and operations
        env:
          FULFILLMENT_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-fulfillment-integration
      - name: Verify encrypted emergency lifecycle, responder locking and SLA controls
        env:
          EMERGENCY_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-emergency-integration
      - name: Verify durable homes, classifieds, contact encryption and retention
        env:
          LOCAL_VERTICALS_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-local-verticals-integration
      - name: Verify durable social privacy, messaging, moderation and rewards
        env:
          SOCIAL_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-social-integration
      - name: Verify published governance dashboards, masking and country isolation
        env:
          GOVERNANCE_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-governance-integration
      - name: Verify FIFO wallet ledger, refunds and reward controls against PostgreSQL
        env:
          WALLET_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-wallet-integration
      - name: Verify tenant-isolated append-only audit chains against PostgreSQL
        env:
          AUDIT_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-audit-integration
      - name: Verify durable administrator sessions, four-eyes controls and CMS routing
        env:
          ADMIN_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-admin-integration
      - name: Verify secure media lifecycle persistence against PostgreSQL
        env:
          MEDIA_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-media-integration
      - name: Start isolated JetStream broker
        run: docker run --detach --name planext4u-nats-test --publish 4222:4222 nats:2.14.5-alpine3.22 --jetstream
      - name: Verify durable outbox, inbox and JetStream publication
        env:
          MESSAGING_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
          NATS_TEST_URL: nats://127.0.0.1:4222
        run: make test-messaging-integration
      - name: Verify notification queue, receipts and encrypted device tokens
        env:
          NOTIFICATION_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-notification-integration
      - name: Verify all migrations from zero, rollback isolation and checksum drift
        env:
          MIGRATION_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/planext4u_test?sslmode=disable
        run: make test-migrations-integration
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./cmd/... ./internal/...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.14
          cache: true
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go
          build-mode: manual
      - name: Build Go services for CodeQL
        run: go build ./...
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          output: codeql-results
          upload: false
      - name: Enforce zero CodeQL findings
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sarif_files < <(find codeql-results -type f -name '*.sarif' -print)
          test "${#sarif_files[@]}" -gt 0
          for sarif_file in "${sarif_files[@]}"; do
            jq -e '[.runs[]?.results[]?] | length == 0' "$sarif_file"
          done
      - name: Upload CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-codeql-${{ github.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30

  terraform:
    name: Terraform format, validation and IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.14
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate Terraform roots
        run: make infra-check
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  container:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build release container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: planext4u-backend:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: planext4u-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: planext4u-backend:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
