# Private Unix socket only. No TCP listener or host port.
Foreground yes
User clamav
LogTime yes
LogClean no
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
MaxThreads 2
MaxQueue 8
ConcurrentDatabaseReload no
StreamMaxLength 16M
MaxFileSize 16M
MaxScanSize 32M
MaxScanTime 10000
ReadTimeout 10
CommandReadTimeout 5
SelfCheck 60
AlertExceedsMax yes
