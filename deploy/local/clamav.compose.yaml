name: planext4u-phase2-security
services:
  clamav-init:
    image: clamav/clamav:1.4.7@sha256:ac15046e610610347c459afabea6683a52cd041c7a10adf5f050ebb05525d62d
    entrypoint: ["sh", "-c", "chown 100:101 /var/lib/clamav /run/clamav && chmod 0770 /run/clamav"]
    network_mode: none
    volumes:
      - clamav-signatures:/var/lib/clamav
      - clamav-socket:/run/clamav
    labels:
      net.planext4u.environment: local-phase2
  # Finish the first signature update before clamd loads the database.
  # The daemon cannot receive NotifyClamd while its socket is still absent.
  clamav-bootstrap:
    image: clamav/clamav:1.4.7@sha256:ac15046e610610347c459afabea6683a52cd041c7a10adf5f050ebb05525d62d
    command: ["freshclam", "--config-file=/etc/clamav/planext4u-freshclam.conf", "--stdout"]
    depends_on:
      clamav-init:
        condition: service_completed_successfully
    volumes:
      - clamav-signatures:/var/lib/clamav
      - clamav-socket:/run/clamav
      - ./clamd.conf:/etc/clamav/planext4u.conf:ro
      - ./freshclam.conf:/etc/clamav/planext4u-freshclam.conf:ro
    mem_limit: 2g
    cpus: 1
    environment:
      TZ: UTC
    restart: "no"
    labels:
      net.planext4u.environment: local-phase2
  clamav-update:
    image: clamav/clamav:1.4.7@sha256:ac15046e610610347c459afabea6683a52cd041c7a10adf5f050ebb05525d62d
    command: ["freshclam", "--config-file=/etc/clamav/planext4u-freshclam.conf", "--daemon", "--foreground", "--stdout"]
    depends_on:
      clamav-bootstrap:
        condition: service_completed_successfully
    volumes:
      - clamav-signatures:/var/lib/clamav
      - clamav-socket:/run/clamav
      - ./clamd.conf:/etc/clamav/planext4u.conf:ro
      - ./freshclam.conf:/etc/clamav/planext4u-freshclam.conf:ro
    mem_limit: 2g
    cpus: 1
    environment:
      TZ: UTC
    restart: unless-stopped
    healthcheck:
      disable: true
    labels:
      net.planext4u.environment: local-phase2
  clamav:
    image: clamav/clamav:1.4.7@sha256:ac15046e610610347c459afabea6683a52cd041c7a10adf5f050ebb05525d62d
    entrypoint: ["clamd", "--config-file=/etc/clamav/planext4u.conf", "--foreground"]
    user: "100:101"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:uid=100,gid=101,mode=0700,size=256m
    volumes:
      - clamav-signatures:/var/lib/clamav:ro
      - clamav-socket:/run/clamav
      - ./clamd.conf:/etc/clamav/planext4u.conf:ro
      - ./clamav-health.sh:/etc/clamav/planext4u-health.sh:ro
    depends_on:
      clamav-bootstrap:
        condition: service_completed_successfully
    mem_limit: 4g
    cpus: 2
    environment:
      TZ: UTC
    restart: unless-stopped
    healthcheck:
      # Readiness requires both INSTREAM scans and fresh signatures actually loaded by clamd.
      test: ["CMD", "sh", "/etc/clamav/planext4u-health.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    labels:
      net.planext4u.environment: local-phase2
volumes:
  clamav-signatures:
    name: planext4u-phase2-clamav-signatures
  clamav-socket:
    name: planext4u-phase2-clamav-socket
