name: planext4u-local

services:
  postgres:
    image: postgres:17.10-alpine3.22
    environment:
      POSTGRES_DB: planext4u_local
      POSTGRES_USER: planext4u_local
      POSTGRES_PASSWORD: local-only-password
      PLANEXT4U_LOCAL_IDENTITY_PASSWORD: ${PLANEXT4U_LOCAL_IDENTITY_PASSWORD:-local-identity-only}
      PLANEXT4U_LOCAL_CONFIGURATION_PASSWORD: ${PLANEXT4U_LOCAL_CONFIGURATION_PASSWORD:-local-configuration-only}
      PLANEXT4U_LOCAL_CATALOG_PASSWORD: ${PLANEXT4U_LOCAL_CATALOG_PASSWORD:-local-catalog-only}
      PLANEXT4U_LOCAL_MEDIA_PASSWORD: ${PLANEXT4U_LOCAL_MEDIA_PASSWORD:-local-media-only}
      PLANEXT4U_LOCAL_AUDIT_PASSWORD: ${PLANEXT4U_LOCAL_AUDIT_PASSWORD:-local-audit-only}
      PLANEXT4U_LOCAL_MESSAGING_PASSWORD: ${PLANEXT4U_LOCAL_MESSAGING_PASSWORD:-local-messaging-only}
      PLANEXT4U_LOCAL_NOTIFICATION_PASSWORD: ${PLANEXT4U_LOCAL_NOTIFICATION_PASSWORD:-local-notification-only}
      PLANEXT4U_LOCAL_TRANSACTION_PASSWORD: ${PLANEXT4U_LOCAL_TRANSACTION_PASSWORD:-local-transaction-only}
      PLANEXT4U_LOCAL_ADMIN_PASSWORD: ${PLANEXT4U_LOCAL_ADMIN_PASSWORD:-local-admin-only}
    ports:
      - "${PLANEXT4U_LOCAL_POSTGRES_PORT:-54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planext4u_local -d planext4u_local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.0-alpine3.23
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${PLANEXT4U_LOCAL_REDIS_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  nats:
    image: nats:2.14.5-alpine3.22
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "${PLANEXT4U_LOCAL_NATS_PORT:-42220}:4222"
      - "${PLANEXT4U_LOCAL_NATS_MONITOR_PORT:-48222}:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - nats-data:/data

  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: planext4u-local
      MINIO_ROOT_PASSWORD: local-only-object-password
    ports:
      - "${PLANEXT4U_LOCAL_OBJECT_PORT:-9000}:9000"
      - "${PLANEXT4U_LOCAL_OBJECT_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - object-data:/data

  synthetic-provider:
    build:
      context: ../..
      dockerfile: deploy/local/fake-provider.Dockerfile
    ports:
      - "${PLANEXT4U_LOCAL_PROVIDER_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  nats-data:
  object-data:
