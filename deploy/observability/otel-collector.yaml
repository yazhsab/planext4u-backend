receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes/privacy:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: url.query
        action: delete
      - key: enduser.id
        action: delete
  batch:
    send_batch_size: 2048
    timeout: 5s

exporters:
  otlp/backend:
    endpoint: ${env:PLANEXT4U_OBSERVABILITY_OTLP_ENDPOINT}
    tls:
      insecure: false
    headers:
      Authorization: ${env:PLANEXT4U_OBSERVABILITY_AUTHORIZATION}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlp/backend]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlp/backend]
